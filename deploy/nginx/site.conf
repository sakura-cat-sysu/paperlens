root /usr/share/nginx/html;
index index.html;
client_max_body_size 11m;
client_body_timeout 30s;
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://api:8000;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /healthz {
    access_log off;
    return 200 'ok';
}
location = /release.json {
    expires -1;
    try_files $uri =404;
}
location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
}
location /api/ {
    proxy_pass $backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $paperlens_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_send_timeout 60s;
}
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
