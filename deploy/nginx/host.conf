server {
    listen 80;
    listen [::]:80;
    server_name paperlens.aktools.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paperlens-acme;
    }
    location / { return 301 https://paperlens.aktools.cn$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name paperlens.aktools.cn;
    ssl_certificate /etc/letsencrypt/live/paperlens.aktools.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paperlens.aktools.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
