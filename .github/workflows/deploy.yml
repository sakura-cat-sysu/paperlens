name: Deploy production
on:
  workflow_run:
    workflows: [Quality]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Check deployment configuration
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            test -n "${!name}" || { echo "Missing production secret: $name" >&2; exit 1; }
          done
      - name: Install SSH identity
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Publish and deploy exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" != "$RELEASE_SHA" ]]; then
            echo 'A newer main commit exists; skip this obsolete release'
            exit 0
          fi
          git archive --format=tar.gz "$RELEASE_SHA" > release.tar.gz
          ssh -T -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "paperlens-deploy $RELEASE_SHA" < release.tar.gz
      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
