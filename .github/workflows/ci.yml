name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paperlens_test
          POSTGRES_USER: paperlens
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U paperlens -d paperlens_test" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: paperlens
          RABBITMQ_DEFAULT_PASS: ci-only
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://paperlens:ci-only@127.0.0.1:5432/paperlens_test
      TEST_DATABASE_URL: postgresql+psycopg://paperlens:ci-only@127.0.0.1:5432/paperlens_test
      CELERY_BROKER_URL: amqp://paperlens:ci-only@127.0.0.1:5672//
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.33
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run alembic upgrade head && uv run alembic check
      - run: uv run ruff check backend scripts deploy tests/test_api.py tests/test_storage.py tests/test_deployment.py tests/test_release_access.py
      - run: uv run pytest -q
      - run: npm ci --prefix frontend --no-fund --no-audit
      - run: npm --prefix frontend run generate:api && git diff --exit-code frontend/src/api/schema.d.ts
      - run: npm --prefix frontend run format:check && npm --prefix frontend test && npm --prefix frontend run build
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
      - run: for file in deploy/*.sh; do bash -n "$file"; done
      - run: docker build -t paperlens-api:ci . && docker build -f frontend/Dockerfile -t paperlens-web:ci .
      - run: uv run python scripts/check_containers.py
